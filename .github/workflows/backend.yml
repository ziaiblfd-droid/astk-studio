name: Build and validate backend image

on:
  push:
    paths:
      - "Dockerfile"
      - "requirements-backend.txt"
      - "backend/**"
      - "tests/**"
      - "vendor/**"
      - "scripts/run-astk-job.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements-backend.txt"
      - "backend/**"
      - "tests/**"
      - "vendor/**"
      - "scripts/run-astk-job.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/astk-studio-backend

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: astk-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify native ASTK and portable SUPPA modules
        run: >-
          docker run --rm --entrypoint python3 astk-studio:ci -c
          "import importlib.metadata, astk.suppa, sys;
          print('ASTK', importlib.metadata.version('astk'));
          sys.path.insert(0, 'vendor/suppa2');
          import eventGenerator, psiCalculator, significanceCalculator;
          print('SUPPA modules imported')"
      - name: Build ARM64 backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Python tests
        run: docker run --rm --entrypoint python3 astk-studio:ci -m unittest discover -s tests -v
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
