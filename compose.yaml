services:
  astk-studio:
    build:
      context: .
      platforms:
        - linux/amd64
    image: astk-studio:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      ASTK_EXECUTION_MODE: command
      ASTK_RUNNER_COMMAND: /opt/astk-studio/scripts/run-astk-job.sh {job_dir}
      ASTK_WORKERS: 1
      ASTK_JOB_TIMEOUT: 21600
      ASTK_MAX_UPLOAD_BYTES: 536870912
      ASTK_RETENTION_DAYS: 7
      ASTK_CLEANUP_INTERVAL: 3600
      ASTK_TRUST_PROXY: 1
      ASTK_MM10_GTF: /refs/mm10/gencode.vM25.annotation.gtf
      ASTK_HG38_GTF: /refs/hg38/gencode.v44.annotation.gtf
    volumes:
      - astk_jobs:/opt/astk-studio/data
      - ./references:/refs:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  astk_jobs:
